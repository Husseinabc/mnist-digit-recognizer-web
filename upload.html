<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digits · ارفع صورة</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="nav"></header>
<main class="wrap">
  <div class="hero">
    <h1>ارفع صورة <em>Upload an image</em></h1>
    <p>صورة رقم مكتوب بخط اليد · a photo or scan of a handwritten digit</p>
  </div>

  <label class="drop" id="drop" for="file">
    <input id="file" type="file" accept="image/*" hidden>
    <b>اسحب الصورة هنا أو اضغط للاختيار</b>
    <span>Drop an image here or click to choose</span>
  </label>

  <div class="grid" id="out" style="margin-top:16px" hidden>
    <section class="card center">
      <canvas id="orig" class="orig"></canvas>
      <div class="row">
        <button id="invert" class="btn ghost">عكس الألوان · Invert</button>
      </div>
      <div class="seen">
        <canvas id="view" class="px"></canvas>
        <span>ما يراه النموذج<br>The model's view · 28×28</span>
      </div>
    </section>

    <section class="card center">
      <div id="digit" class="digit none">?</div>
      <div id="conf" class="conf">—</div>
      <div id="bars" class="bars"></div>
    </section>
  </div>
  <div id="status" class="status"></div>
</main>

<script src="model.js"></script>
<script src="ui.js"></script>
<script>
UI.nav('upload.html');
var W = null, source = null, manualInvert = false;
var origC = document.getElementById('orig'), view = document.getElementById('view');
var out = document.getElementById('out');
var res = UI.result(document.getElementById('digit'), document.getElementById('conf'), UI.buildBars(document.getElementById('bars')));

function run() {
  if (!source || !W) return;
  var s = Math.min(1, 400 / Math.max(source.width, source.height));
  var w = Math.max(1, Math.round(source.width * s)), h = Math.max(1, Math.round(source.height * s));
  origC.width = w; origC.height = h;
  var ctx = origC.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);      // transparent PNGs become white paper
  ctx.drawImage(source, 0, 0, w, h);
  var d = ctx.getImageData(0, 0, w, h).data;
  var gray = new Float32Array(w * h);
  for (var i = 0; i < gray.length; i++) gray[i] = 0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2];

  // light border = light paper = dark ink, so flip to white-on-black like MNIST
  var border = [];
  for (var x = 0; x < w; x++) { border.push(gray[x]); border.push(gray[(h - 1) * w + x]); }
  for (var y = 0; y < h; y++) { border.push(gray[y * w]); border.push(gray[y * w + w - 1]); }
  border.sort(function (a, b) { return a - b; });
  var invert = border[border.length >> 1] > 127;
  if (manualInvert) invert = !invert;
  if (invert) for (var j = 0; j < gray.length; j++) gray[j] = 255 - gray[j];

  out.hidden = false;
  var img = MODEL.preprocess(gray, w, h);
  if (!img) { res.empty(); UI.drawGray(view, new Float32Array(784), 28, 28, 112); return; }
  UI.drawGray(view, img, 28, 28, 112);
  res.show(MODEL.predict(img, W));
}

function loadFile(file) {
  if (!file || file.type.indexOf('image/') !== 0) return;
  var url = URL.createObjectURL(file), im = new Image();
  im.onload = function () { source = im; manualInvert = false; URL.revokeObjectURL(url); run(); };
  im.src = url;
}

document.getElementById('file').addEventListener('change', function (e) { loadFile(e.target.files[0]); });
document.getElementById('invert').addEventListener('click', function () { manualInvert = !manualInvert; run(); });
var drop = document.getElementById('drop');
['dragenter', 'dragover'].forEach(function (t) { drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.add('over'); }); });
['dragleave', 'drop'].forEach(function (t) { drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.remove('over'); }); });
drop.addEventListener('drop', function (e) { loadFile(e.dataTransfer.files[0]); });

res.empty();
UI.loadModel(document.getElementById('status')).then(function (w) { W = w; run(); });
</script>
</body>
</html>
